services:
  dfvpnbot:
    build: .
    image: df-vpn-bot:latest
    container_name: dfvpnbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Публикуйте порт только если включены вебхуки ЮKassa (WEBHOOK_ENABLED=true)
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
